<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
        overflow: hidden;
      }

      video {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        background: #111;
      }
    </style>
  </head>
  <body>
    <video id="video" muted playsinline preload="auto"></video>
    <script>
      const video = document.getElementById("video");
      const params = new URLSearchParams(window.location.search);
      const time = Number(params.get("t") || 0);
      video.src =
        "file:///C:/Users/LENOVO/Downloads/WhatsApp%20Video%202026-09-05%20at%201.17.19%20PM.mp4";
      video.addEventListener("loadedmetadata", () => {
        video.currentTime = Math.min(time, Math.max(0, video.duration - 0.1));
      });
      video.addEventListener("seeked", () => {
        video.pause();
        document.body.dataset.ready = "true";
      });
    </script>
  </body>
</html>
